<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnHub</title>
    <link rel="stylesheet" href="style8.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
    <div id="contents">
        <div id="left_content">
            <img src="left_content_Image.png" alt="left_content_image">
        </div>
        <div id="right_content">
            <form name="login_form" action="/action">
                <label for="full_name">Full Name</label>
                <input type="text" name="full_name" placeholder="Enter your full name" id="full_name">
                <label for="Email">Email</label>
                <input type="email" name="login_email" placeholder="Enter your email" id="Email">
                <label for="Password">Password</label>
                <input type="password" name="login_password" placeholder="Enter your password" id="Password">
                <button id="create_account_button" type="submit">Create Account</button>
                <div id="divider">
                    <p> or </p>
                </div>
                <button id="login_using_google" type="button">
                    <img width="250" alt="Google logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Google_Favicon_2025.svg/250px-Google_Favicon_2025.svg.png">
                    <span id="continue_with_google">Continue with Google</span>
                </button>
                <div id="other_options">
                    <p>Already have an account? <a href="C:\Users\ashis\OneDrive\Desktop\Code\My project\loginpage\login_page.html">Login</a></p>
                </div>
            </form>
        </div>
    </div>
    </body>
</html>
