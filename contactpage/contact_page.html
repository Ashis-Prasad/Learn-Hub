<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnHub</title>
    <link rel="stylesheet" href="style6.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
    <header>
        <div id="main_icon">
            <div id="main_icon">
            <div id="main_icon_image">
                <img src="../mainpage/home_page_icon.jpg" alt="icon">
            </div>
            <div id="main_icon_heading">
                <a href="../mainpage/index.html">LearnHub</a>
            </div>
        </div>
        </div>
        <div id="rem_header">
            <a href="../coursepage/coursepage.html">Courses</a>
            <a href="../resourcepage/resource_page.html">Resources</a>
            <a href="../blogpage/blogpage.html">Blog</a>
            <a href="../aboutpage/about_page.html">About</a>
            <a href="../contactpage/contact_page.html">Contact</a>
            <span id="get_started_btn">
                <a href="../loginpage/login_page.html" >Get Started</a>
            </span>
        </div>
    </header>
    <main>
        <div id="contact_home_page_contents">

            <div id="left_contents">

                <div id="left_contents_first_division">
                    <div id="first_content">
                        <div id="main_content">
                            <span id="main_content_1">
                                <p id="first_line">Get in<span id="second_line"> Touch</span></p>
                            </span>
                        </div>
                        <div id="main_content_2">
                            <p id="third_line">Have any questions or need help?</p>
                            <p id="fourth_line">We're are here for you!</p>
                        </div>
                    </div>
                </div>

                <div id="left_contents_second_division">

                    <div class="division">
                        <div class="icon">
                            <img src="email_icon_image.png" alt="email_icon_image">
                        </div>
                        <div class="words">
                            <div class="heading_word">Email</div>
                            <div>support@learnhub.com</div>
                        </div>
                    </div>

                    <div class="division">
                        <div class="icon">
                            <img src="phone_icon_image.png" alt="phone_icon_image">
                        </div>
                        <div class="words">
                            <div class="heading_word">Phone</div>
                            <div>+91 9876543210</div>
                        </div>
                    </div>

                    <div class="division">
                        <div class="icon">
                            <img src="address_icon_image.png" alt="address_icon_image">
                        </div>
                        <div class="words">
                            <div class="heading_word">Address</div>
                            <div>123,Education Society,Delhi-459389</div>
                        </div>
                    </div>

                    <div class="division">
                        <div class="icon">
                            <img src="clock_icon_image.png" alt="clock_icon_image">
                        </div>
                        <div class="words">
                            <div class="heading_word">Hours</div>
                            <div>Mon-Fri:9:00AM - 6:00PM</div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="right_contents">
                <form name="contact_form" action="#" id="contact_form" >
                    <label for="your_name">Your Name</label>
                    <input type="text" name="t1" id="your_name"placeholder="Enter your name">
                    <label for="email">Email</label>
                    <input type="text" name="t1" id="email"placeholder="Enter your email">
                    <label for="subject">Subject</label>
                    <input type="text" name="t1" id="subject"placeholder="Enter subject">
                    <label for="message">Message</label>
                    <textarea name="message" placeholder="Type your message..." id="message" rows="7" columns="10"></textarea>
                    <button href="#">Send Message</button>
                </form>
            </div>
        </div>
        
    </main>
</body>
</html>
